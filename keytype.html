<div class="stage" id="s"><i></i><i></i></div>
<div class="panel">
  <h1>Реальный фон keytype (Type, тёмная палитра)</h1>
  <p>Два слоя с логотипом, ленты едут навстречу друг другу. Переключайте угол и смотрите на края букв в Firefox: при 0° они «щёлкают», с 0,05° и больше плывут.</p>
  <div class="row" id="b"></div>
  <div id="i"></div>
</div>
<script>
var A=[0,0.01,0.05,0.3],s=document.getElementById('s'),b=document.getElementById('b');
function set(a){s.style.setProperty('--a',a+'deg');[].forEach.call(b.children,function(x){x.setAttribute('aria-pressed',x.dataset.a==a)})}
A.forEach(function(a){var x=document.createElement('button');x.textContent=a+'°';x.dataset.a=a;x.onclick=function(){set(a)};b.appendChild(x)});
set(0.3);
document.getElementById('i').textContent='dpr '+devicePixelRatio+' · '+navigator.userAgent.replace(/.*(Firefox|Edg|Chrome)\/([\d.]+).*/,'$1 $2');
</script>
</body>
