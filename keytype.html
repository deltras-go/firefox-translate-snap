<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фон keytype: чистый сдвиг и поворот</title>
<style>
:root{--bg:#0d0d0f;--fg:#ece8df;--mut:#9a9483;--acc:#e0b25a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,#0d0d0f,#2f2618)}
.stage i{position:absolute;left:calc(var(--x0) - var(--m));top:calc(var(--y0) - var(--m));width:calc(100% + var(--w) + var(--m) * 2);height:calc(100% + var(--h) + var(--m) * 2);
  --m:max(12px,1vw);will-change:transform;animation:plv 35.1s linear infinite;background-size:290px 290px}
.stage i:nth-child(1){background-image:url(img/dark-type-live-b.svg);--w:290px;--h:290px;--x0:-290px;--y0:0px;--x1:0px;--y1:-290px}
.stage i:nth-child(2){background-image:url(img/dark-type-live-a.svg);--w:290px;--h:290px;--x0:0px;--y0:-290px;--x1:-290px;--y1:0px}
@keyframes plv{
  from{transform:rotate(var(--a,.3deg)) translate3d(0,0,0)}
  to{transform:rotate(var(--a,.3deg)) translate3d(calc(var(--x1) - var(--x0)),calc(var(--y1) - var(--y0)),0)}}
.panel{position:fixed;left:16px;bottom:16px;max-width:360px;padding:14px 16px;border-radius:12px;background:rgba(13,13,15,.82);backdrop-filter:blur(6px);border:1px solid rgba(224,178,90,.25)}
.panel h1{font-size:15px;margin:0 0 6px;color:var(--acc)}
.panel p{margin:0 0 10px;color:var(--mut);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid rgba(224,178,90,.35);background:transparent;color:var(--fg);cursor:pointer}
button[aria-pressed=true]{background:var(--acc);color:#1b1408;border-color:var(--acc)}
#i{margin-top:8px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="stage" id="s"><i></i><i></i></div>
<div class="panel">
  <h1>Реальный фон keytype (Type, тёмная палитра)</h1>
  <p>Два слоя с логотипом, ленты едут навстречу друг другу. Переключайте угол и смотрите на края букв в Firefox: при 0° они «щёлкают», с 0,05° и больше плывут.</p>
  <div class="row" id="b"></div>
  <div id="i"></div>
</div>
<script>
var A=[0,0.01,0.05,0.3],s=document.getElementById('s'),b=document.getElementById('b');
function set(a){s.style.setProperty('--a',a+'deg');[].forEach.call(b.children,function(x){x.setAttribute('aria-pressed',x.dataset.a==a)})}
A.forEach(function(a){var x=document.createElement('button');x.textContent=a+'°';x.dataset.a=a;x.onclick=function(){set(a)};b.appendChild(x)});
set(0.3);
document.getElementById('i').textContent='dpr '+devicePixelRatio+' · '+navigator.userAgent.replace(/.*(Firefox|Edg|Chrome)\/([\d.]+).*/,'$1 $2');
</script>
</body>
</html>
